name: Check Tools Consistency

# Runs on every PR (no path filter on purpose): a new or renamed tool must trip
# this check even when nobody touched tools.json or the install/convert scripts.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-tools:
    name: checks and converted outputs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS ships bash 3.2, Linux ships bash 5 — the converter must work on both.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # The outputs eval parses with PyYAML and tomllib (Python 3.11+). Pin both
      # so the two runners parse the same way.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python3 -m pip install pyyaml

      - name: Run the checks and outputs suites
        # scripts/run-tests.sh holds the test list (run it with --list to see it).
        # Drift is advisory on pull requests (agent PRs always move their own manifest line;
        # maintainers regenerate at landing) and enforced on pushes to main.
        run: bash scripts/run-tests.sh checks outputs ${{ github.event_name == 'pull_request' && '--drift=advisory' || '' }}
